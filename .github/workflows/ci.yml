name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record tool versions
        run: node --version && pnpm --version && pnpm exec tsc --version
      - name: Typechecks, lint, logic, tooling, and fixtures
        run: node scripts/quality/verify.mjs --group static

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - name: Record tool versions
        run: rustc --version && cargo --version && cargo clippy --version
      - name: Formatting, Clippy, unit/integration/doc tests
        run: node scripts/quality/verify.mjs --group rust

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Production builds, live WebTransport, real multiplayer E2E
        run: node scripts/quality/verify.mjs --group browser
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echo-browser-failures-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: quality-gate
    needs: [static, rust, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification group to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          printf 'static=%s rust=%s browser=%s\n' "$STATIC_RESULT" "$RUST_RESULT" "$BROWSER_RESULT"
          test "$STATIC_RESULT" = success
          test "$RUST_RESULT" = success
          test "$BROWSER_RESULT" = success
