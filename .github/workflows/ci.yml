name: CI
on:
  push:
    branches: [main, feat/echo-webtransport-abilities]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Browser-side logic and motor fixtures
        run: pnpm run test:ts && pnpm run fixtures:check && pnpm run test:launcher
      - name: Rust simulation, protocol and motor parity
        run: cargo test --workspace --locked
      - name: Typecheck and production build
        run: pnpm run build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Real Rust and browser WebTransport integration
        run: pnpm run test:network
      - name: Two-client WebGL checks
        run: pnpm run test:e2e
      - name: Retain actual generated lockfiles for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfiles
          path: |
            pnpm-lock.yaml
            Cargo.lock
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: echo-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
