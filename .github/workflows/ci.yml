name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test and build
        run: |
          if [ -f tsconfig.json ]; then npm test && npm run build; fi
      - name: Browser tests
        run: |
          if [ -f playwright.config.ts ]; then npx playwright install --with-deps chromium && npm run test:e2e; fi
      - name: Package verification artifacts
        if: always()
        run: tar -czf verification.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echo-verification
          path: |
            verification.tar.gz
            test-results/
            playwright-report/
          retention-days: 3
