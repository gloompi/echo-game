name: Refactor baseline
on:
  push:
    branches: [refactor/quality-foundation]
    paths: [.github/workflows/refactor-baseline.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source and inventory
        run: |
          git archive HEAD -o echo-source.tar
          git ls-files | sort
          find client shared crates scripts tests -type f \( -name '*.ts' -o -name '*.rs' -o -name '*.mjs' \) -exec wc -l {} + | sort -rn | head -45
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-source
          path: echo-source.tar
          retention-days: 2
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - run: pnpm install --frozen-lockfile
      - name: Existing tests and typecheck
        run: pnpm run typecheck && pnpm run test:ts && pnpm run fixtures:check && pnpm run test:launcher && cargo test --workspace --locked
      - name: Record existing formatting and lint debt
        if: always()
        run: |
          cargo fmt --all -- --check > baseline-format.txt 2>&1; FORMAT_STATUS=$?
          cargo clippy --workspace --all-targets --locked -- -D warnings > baseline-clippy.txt 2>&1; CLIPPY_STATUS=$?
          cat baseline-format.txt baseline-clippy.txt
          echo "Baseline formatting exit=$FORMAT_STATUS; Clippy exit=$CLIPPY_STATUS"
          test "$FORMAT_STATUS" = 0 && test "$CLIPPY_STATUS" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-baseline-logs
          path: baseline-*.txt
          retention-days: 7
